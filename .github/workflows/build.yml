name: Build Unsigned IPA & Release
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build (no signing)
        run: |
          xcodebuild -project SyncFlow/SyncFlow.xcodeproj \
            -scheme SyncFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SyncFlow.app Payload/
          zip -qr SyncFlow-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SyncFlow-unsigned-ipa
          path: SyncFlow-unsigned.ipa

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SyncFlow-unsigned.ipa
          name: SyncFlow iOS Release ${{ github.ref_name }}
          body: |
            ## 🚀 SyncFlow Unsigned IPA Build
            - Phiên bản: `${{ github.ref_name }}`
            - Cài đặt qua **Sideloadly** (miễn phí), **TrollStore** hoặc **AltStore**.
            - Hỗ trợ iOS 17.0+, đầy đủ tính năng Apple QuickLook Preview, Native ShareSheet, lưu Photos và đồng bộ tệp 2 chiều.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
