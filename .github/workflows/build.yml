name: Build Unsigned IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build (no signing)
        run: |
          xcodebuild -project SyncFlow/SyncFlow.xcodeproj \
            -scheme SyncFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SyncFlow.app Payload/
          zip -qr SyncFlow-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SyncFlow-unsigned-ipa
          path: SyncFlow-unsigned.ipa
